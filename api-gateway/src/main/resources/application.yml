spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: core-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/instituicoes/**,/api/v1/profissionais/**,/api/v1/pacientes/**

            - id: scheduling-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/vagas/**,/api/v1/agendamentos/**

            - id: clinical-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/atendimentos/**

server:
  port: 8085