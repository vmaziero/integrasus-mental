services:
  postgres:
    image: postgres:16
    container_name: integrasus-core-postgres
    environment:
      POSTGRES_DB: integrasus_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - integrasus_core_data:/var/lib/postgresql/data

  postgres-scheduling:
    image: postgres:16
    container_name: integrasus-scheduling-postgres
    environment:
      POSTGRES_DB: integrasus_scheduling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - integrasus_scheduling_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: integrasus-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  postgres-clinical:
    image: postgres:16
    container_name: integrasus-clinical-postgres
    environment:
      POSTGRES_DB: integrasus_clinical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - integrasus_clinical_data:/var/lib/postgresql/data

volumes:
  integrasus_core_data:
  integrasus_scheduling_data:
  integrasus_clinical_data: